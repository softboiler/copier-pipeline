# Publish release
name: "release"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: True
on: ["workflow_dispatch"]
defaults:
  run:
    shell: "pwsh"
jobs:
  env:
    uses: "./.github/workflows/env.yml"
  ci:
    uses: "./.github/workflows/ci.yml"
  release:
    needs:
      - "env"
      - "ci"
    permissions:
      contents: "write"
      discussions: "write"
      id-token: "write"
      attestations: "write"
    runs-on: "runs-on: ${{ needs.env.outputs.actions_runner }}"
    environment:
      name: "release"
      url: "https://pypi.org/p/${{ needs.env.outputs.uv_version }}"
    steps:
      - uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
      - uses: "astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca" # v6.0.1
        with:
          version: "${{ needs.env.outputs.uv_version }}"
          enable-cache: true
      - run: "uv build"
      - run: "rm dist/.gitignore"
      - uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: "dist/**"
      - run: "uv publish"
      - run: "gh release create --discussion-category announcements 0.0.0 dist/**"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
  changerelease:
    needs: "release"
    permissions:
      contents: "write"
    uses: "./.github/workflows/changerelease.yml"
