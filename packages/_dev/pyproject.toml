[build-system]
requires = ["uv-build==0.7.3"]
build-backend = "uv_build"

[project]
name = "copier-pipeline-dev"
version = "0.0.0"
requires-python = ">=3.13.3"
dependencies = [
  "cappa>=0.27.2",
  "cyclopts>=3.16.0",
  "dulwich>=0.22.8",
  "pydantic-settings>=2.9.1",
  "python-dotenv>=1.1.0",
  # ? Docs
  "docutils>=0.21.2",
  "myst-parser>=4.0.1",
  "numpydoc>=1.8.0",
  "ruamel-yaml>=0.18.10",
  "sphinx>=8.2.3",
]
[project.scripts]
copier-pipeline-dev = "copier_pipeline_dev.__main__:main"

[tool.fawltydeps]
deps = ["packages/_dev/pyproject.toml"]
code = ["packages/_dev", "docs", "tests"]
ignore_undeclared = [
  "copier_pipeline_dev",
  "copier_pipeline_pipeline",
  "copier_pipeline",
  "toml",
]
[tool.fawltydeps.custom_mapping]
ruamel-yaml = ["ruamel"]
