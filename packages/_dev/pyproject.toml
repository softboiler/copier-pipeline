[build-system]
requires = ["uv-build==0.6.16"]
build-backend = "uv_build"

[project]
name = "copier-pipeline-dev"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["cappa>=0.26.4", "dulwich>=0.22.1"]
[project.scripts]
"copier-pipeline-dev" = "copier_pipeline_dev.__main__:main"

[tool.fawltydeps]
deps = ["packages/_dev/pyproject.toml"]
code = ["packages/_dev", "tests"]
ignore_undeclared = ["copier_pipeline"]
