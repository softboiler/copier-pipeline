[build-system]
requires = ["uv-build==0.6.16"]
build-backend = "uv_build"

[project]
name = "copier-pipeline-dev"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "cappa>=0.26.4",
  "cyclopts>=3.14.2",
  "dulwich>=0.22.1",
  # ? Docs
  "ruamel-yaml>=0.18.6",
]
[project.scripts]
copier-pipeline-dev = "copier_pipeline_dev.__main__:main"

[tool.fawltydeps]
deps = ["packages/_dev/pyproject.toml"]
code = ["packages/_dev", "docs", "tests"]
ignore_undeclared = ["copier_pipeline"]
[tool.fawltydeps.custom_mapping]
ruamel-yaml = ["ruamel"]
